<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#04070c">
<meta name="description" content="Territory Missions — hospital activation map">
<meta name="robots" content="noindex, nofollow">
<title>Territory Missions</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🗺️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="css/app.css?v=19">
</head>
<body>

<!-- ═══ PASSCODE GATE ═══ -->
<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <div class="gate-crest">◆</div>
    <h1 class="gate-title">TERRITORY<span>MISSIONS</span></h1>
    <p class="gate-sub" data-i18n="gateSub">Restricted field tool · enter access code</p>
    <form id="gate-form" autocomplete="off">
      <input id="gate-input" type="password" inputmode="text" placeholder="••••••••"
             aria-label="Access code" autocomplete="current-password">
      <button type="submit" class="gate-btn" data-i18n="gateBtn">DEPLOY</button>
    </form>
    <p id="gate-error" class="gate-error" role="alert" hidden data-i18n="gateErr">Incorrect code</p>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app" class="app" hidden>

  <header class="hud">
    <div class="hud-row">
      <button id="btn-clusters" class="icon-btn" aria-label="Clusters" title="Clusters">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
      <div class="hud-title">
        <h1>TERRITORY MISSIONS</h1>
        <p id="hud-sub" class="hud-sub">—</p>
      </div>
      <button id="btn-lang" class="icon-btn lang-btn" aria-label="Switch language">ع</button>
      <button id="btn-search" class="icon-btn" aria-label="Search" title="Search">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="conquest">
      <span id="src-chip" class="src src-snapshot">—</span>
      <div class="conquest-bar"><span id="conquest-fill" class="conquest-fill"></span></div>
      <span id="conquest-pct" class="conquest-pct">0%</span>
    </div>
  </header>

  <div id="map" role="application" aria-label="Map of hospital activation missions across Saudi Arabia"></div>

  <!-- search -->
  <div id="search-wrap" class="search-wrap" hidden>
    <input id="search-input" type="search" placeholder="Search hospital, city, manager…" aria-label="Search">
    <button id="search-close" class="icon-btn" aria-label="Close search">✕</button>
    <ul id="search-results" class="search-results"></ul>
  </div>

  <!-- stage legend / filter -->
  <nav id="legend" class="legend" aria-label="Filter by stage"></nav>

  <!-- cluster drawer -->
  <aside id="drawer" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2 data-i18n="clusters">Clusters</h2>
      <button id="drawer-close" class="icon-btn" aria-label="Close">✕</button>
    </div>
    <div class="drawer-stats" id="drawer-stats"></div>
    <ul id="cluster-list" class="cluster-list"></ul>
    <p class="drawer-foot" id="data-stamp"></p>
  </aside>
  <div id="scrim" class="scrim" hidden></div>

  <!-- hospital panel -->
  <section id="panel" class="panel" aria-live="polite" aria-hidden="true">
    <button id="panel-close" class="panel-close" aria-label="Close">✕</button>
    <div id="panel-body"></div>
  </section>

  <div id="toast" class="toast" hidden></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/config.js?v=19"></script>
<script src="js/i18n.js?v=19"></script>
<script src="js/themes.js?v=19"></script>
<script src="js/fog.js?v=19"></script>
<script src="js/app.js?v=19"></script>
</body>
</html>
